name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - run: echo "Sibling-dependent checks are skipped for fork pull requests because deploy keys are unavailable."
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build and test
        run: bash ./gradlew build
        shell: bash

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agp: ['9.0.0', '9.5.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; (yes || true) | "$SDKMANAGER" --licenses >/dev/null; "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: bash ./gradlew --no-daemon publishToMavenLocal :cli:jar
      - name: Gradle lint and report assertions
        run: bash ./gradlew --no-daemon -p integration/compatibility -PagpVersion=${{ matrix.agp }} assembleDebug verifyLintReports
      - name: Standalone CLI
        shell: bash
        run: |
          set +e
          java -jar cli/build/libs/i18n-lint.jar lint --path integration/compatibility --json > cli-result.json
          code=$?
          set -e
          test "$code" -eq 1
          python -c 'import json; r=json.load(open("cli-result.json")); assert r["status"] == "fail" and any(e.get("id") == "IdInTranslation" for e in r["evidence"])'
      - name: Standalone CLI without Gradle plugin
        if: matrix.agp == '9.0.0'
        run: python integration/test_standalone_cli.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-compatibility-${{ matrix.agp }}
          path: |
            integration/compatibility/build/reports/
            cli-result.json
            .android-kit/runs/

  shared-fixture:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: linter
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/kit-fixture-app
          ssh-key: ${{ secrets.DEPLOY_KEY_KIT_FIXTURE_APP }}
          path: kit-fixture-app
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; (yes || true) | "$SDKMANAGER" --licenses >/dev/null; "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build custom checks
        working-directory: linter
        run: bash ./gradlew --no-daemon :lint-rules:jar
      - name: Run fixture lint variants
        working-directory: kit-fixture-app
        env:
          I18N_LINT_RULES_JAR: ${{ github.workspace }}/linter/lint-rules/build/libs/lint-rules-0.1.0-SNAPSHOT.jar
          I18N_LINT_CONFIG: ${{ github.workspace }}/linter/integration/fixture.i18n-lint.yaml
        run: bash ./gradlew --no-daemon --continue -I ../linter/integration/fixture.init.gradle :app:lintCleanDebug :app:lintDefectsDebug
      - name: Assert clean and L1-L6 findings
        if: always()
        run: python linter/integration/assert_fixture_reports.py kit-fixture-app/app/build/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: shared-fixture-lint
          path: kit-fixture-app/app/build/reports/

  mcp:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: linter
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/android-kit
          ssh-key: ${{ secrets.DEPLOY_KEY_ANDROID_KIT }}
          path: android-kit
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build CLI
        working-directory: linter
        run: bash ./gradlew --no-daemon :cli:jar
      - name: Build shared schema
        working-directory: android-kit
        run: npm ci && npm run build --workspace packages/kit-schema
      - name: Install and test MCP adapter
        working-directory: linter/mcp
        run: npm ci && npm test
